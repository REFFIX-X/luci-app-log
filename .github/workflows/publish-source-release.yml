name: Publish source pre-release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  source-release:
    # Deliberate one-time release commit; ordinary pushes must never create releases.
    if: github.event.head_commit.message == 'release: v1.5.0-r7'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Publish source-only pre-release
        env:
          GH_TOKEN: \${{ github.token }}
          TAG: v1.5.0-r7
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$TAG - Firewall Log add-on (source preview)" \
            --notes-file .github/RELEASE_NOTES.md
