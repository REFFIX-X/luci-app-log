# REFFIX Log Viewer release pipeline: OpenWrt 25.12 / APK only.

on:
  push:
    branches:
      - master

concurrency:
  group: reffix-log-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-packages:
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: '25.12'
            sdk: 'aarch64_cortex-a53-25.12.5'
            ext: apk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare local OpenWrt feed
        shell: bash
        run: |
          mkdir -p .build-feed/luci-app-log-viewer .build-feed/libmaxminddb artifacts
          cp -a Makefile htdocs root .build-feed/luci-app-log-viewer/
          cp packaging/libmaxminddb/Makefile .build-feed/libmaxminddb/Makefile

      - name: Build OpenWrt 25.12 APK packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: reffix
          FEED_DIR: ${{ github.workspace }}/.build-feed
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          PACKAGES: libmaxminddb luci-app-log-viewer
          V: s

      - name: Collect release assets
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APP="$(find artifacts/bin/packages -type f -name "luci-app-log-viewer*.${EXT}" -print -quit)"
          LIB="$(find artifacts/bin/packages -type f -name "libmaxminddb*.${EXT}" -print -quit)"
          test -n "$APP" || { echo 'Could not find built luci-app-log-viewer package'; find artifacts -type f; exit 1; }
          test -n "$LIB" || { echo 'Could not find built libmaxminddb package'; find artifacts -type f; exit 1; }
          cp "$APP" "dist/reffix-luci-app-log-viewer-openwrt-${FAMILY}.${EXT}"
          cp "$LIB" "dist/reffix-libmaxminddb-openwrt-${FAMILY}.${EXT}"
          (cd dist && sha256sum "reffix-luci-app-log-viewer-openwrt-${FAMILY}.${EXT}" "reffix-libmaxminddb-openwrt-${FAMILY}.${EXT}" > "SHA256SUMS-openwrt-${FAMILY}.txt")

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages-${{ matrix.family }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          pattern: openwrt-packages-*
          path: dist
          merge-multiple: true

      - name: Publish direct-download package mirror
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --format=%s "$GITHUB_SHA")"
          TAG="${SUBJECT#release: }"
          case "$TAG" in v*) ;; *) echo "Release commit must start with 'release: v'" >&2; exit 1 ;; esac
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" package-assets >/dev/null 2>&1; then
            git clone --depth 1 --branch package-assets "$REMOTE" package-mirror
          else
            mkdir package-mirror
            git -C package-mirror init -b package-assets
          fi
          # Keep prior package versions available for existing installer fallbacks.
          mkdir -p "package-mirror/${TAG}"
          cp dist/* "package-mirror/${TAG}/"
          printf '%s\n' "$TAG" > package-mirror/latest
          git -C package-mirror config user.name "github-actions[bot]"
          git -C package-mirror config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C package-mirror add -A
          git -C package-mirror commit -m "Publish OpenWrt packages for ${TAG}"
          git -C package-mirror push "$REMOTE" HEAD:package-assets

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --format=%s "$GITHUB_SHA")"
          TAG="${SUBJECT#release: }"
          case "$TAG" in v*) ;; *) echo "Release commit must start with 'release: v'" >&2; exit 1 ;; esac
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # REFFIX Log Viewer ${TAG}

          Standalone OpenWrt packages for aarch64_cortex-a53 routers, including GL.iNet Flint4 / MediaTek Filogic.

          Assets:
          - OpenWrt 25.12 APK app and matching libmaxminddb helper.
          - SHA-256 checksums for the APK package pair.

          The existing luci-app-log-viewer package name is retained for in-place upgrades.
          The release is source-validated; test on-router before production use. GeoLite2 data is downloaded separately.
          EOF
          # Do not carry forward a partial release from an interrupted build.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG - REFFIX Log Viewer" --notes-file "$RUNNER_TEMP/release-notes.md"
